name: Update disaster risk data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: disaster-risk-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: cloud
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: cloud/requirements.txt

      - name: Install analysis dependencies
        run: pip install -r requirements.txt

      - name: Update satellite, InSAR, rainfall, and risk outputs
        env:
          HYP3_TOKEN: ${{ secrets.HYP3_TOKEN }}
        run: python cloud_update.py

      - name: Save latest generated outputs
        working-directory: .
        run: |
          git config user.name "disaster-risk-bot"
          git config user.email "actions@users.noreply.github.com"
          git add cloud/docs cloud/outputs cloud/data/insar cloud/data/raw/sentinel2_active_sample_metadata.json
          git diff --cached --quiet || git commit -m "Update disaster risk data"
          git push

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: cloud/docs

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
